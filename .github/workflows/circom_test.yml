name: Circom Tests

on:
  push:
    branches:
      - main
    tags-ignore:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Circuit Unit/KAT Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: wget https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -O circom && chmod +x circom && sudo mv circom /usr/local/bin/
      - run: npm ci
      - run: npm test
